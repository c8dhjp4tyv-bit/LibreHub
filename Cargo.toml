[workspace]
members = ["crates/common", "services/validator", "services/builder", "services/api", "services/publisher", "services/source", "services/catalog", "services/security", "services/supply-chain"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
librehub-supply-chain = { path = "services/supply-chain" }
librehub-common = { path = "crates/common" }
librehub-validator = { path = "services/validator" }
librehub-builder = { path = "services/builder" }
librehub-publisher = { path = "services/publisher" }
librehub-source = { path = "services/source" }
librehub-catalog = { path = "services/catalog" }
librehub-security = { path = "services/security" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
