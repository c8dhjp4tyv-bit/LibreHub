# TLS reverse proxy for a LibreHub production host. Written for nginx 1.24 (Ubuntu 24.04) and later.
# Installed by scripts/provision.sh as /etc/nginx/conf.d/librehub.conf. Only the hosts below are
# served; anything else is closed. Certificates come from your ACME client (see docs/production-deployment.md).

limit_req_zone $binary_remote_addr zone=public:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status 429;
limit_conn_status 429;

upstream librehub_api { server __DOCKER_HOST_GATEWAY__:8080; keepalive 16; }   # matches LIBREHUB_BIND
upstream librehub_web { server 127.0.0.1:3000; keepalive 16; }     # matches the web publish

# Unknown hosts are rejected, including TLS handshakes with unmatched SNI.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# Plain HTTP only redirects. Nothing is served unencrypted.
server {
    listen 80;
    listen [::]:80;
    server_name librehub.example api.librehub.example repo.librehub.example;
    return 301 https://$host$request_uri;
}

# Web store.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name librehub.example;
    include /etc/librehub/proxy/tls.conf;
    include /etc/librehub/proxy/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.librehub.example; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    client_max_body_size 64k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_conn conns 50;

    location / {
        limit_req zone=public burst=60 nodelay;
        proxy_pass http://librehub_web;
        include /etc/librehub/proxy/proxy-headers.conf;
    }
}

# JSON API. Authentication, admission and OIDC exchange are rate limited separately.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.librehub.example;
    include /etc/librehub/proxy/tls.conf;
    include /etc/librehub/proxy/security-headers.conf;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    limit_conn conns 100;

    # Federated (CI) credential exchange: the tightest limit, per client address.
    location = /api/v1/integrations/github/oidc/exchange {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://librehub_api;
        include /etc/librehub/proxy/proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=public burst=100 nodelay;
        proxy_pass http://librehub_api;
        include /etc/librehub/proxy/proxy-headers.conf;
    }
    # Liveness and readiness for the load balancer and monitoring. Never metrics.
    location = /live { proxy_pass http://librehub_api; include /etc/librehub/proxy/proxy-headers.conf; }
    location = /ready { access_log off; proxy_pass http://librehub_api; include /etc/librehub/proxy/proxy-headers.conf; }
    location = /metrics { return 404; }
    location / { return 404; }
}

# Signed Flatpak repository: static, cacheable, range-capable.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name repo.librehub.example;
    include /etc/librehub/proxy/tls.conf;
    include /etc/librehub/proxy/security-headers.conf;
    root /var/lib/librehub/repository;
    autoindex off;
    default_type application/octet-stream;
    types {
        application/vnd.flatpak.repo flatpakrepo;
        application/vnd.flatpak.ref flatpakref;
        application/x-ostree+gpg-key gpg;
    }
    sendfile on;
    aio threads;
    # An add_header in a location replaces the server-level headers there, so each block that sets
    # Cache-Control also includes the security headers.
    location /repo/ {
        # OSTree objects are content-addressed and immutable; refs and indexes are not.
        location ~* \.(commit|dirmeta|dirtree|filez|file)$ {
            include /etc/librehub/proxy/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        include /etc/librehub/proxy/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location ~ ^/repo/.*\.(flatpakrepo|flatpakref|gpg)$ {
        include /etc/librehub/proxy/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location / { return 404; }
}
