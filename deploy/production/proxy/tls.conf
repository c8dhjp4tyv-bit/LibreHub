# Modern TLS only. Certificates are supplied by the ACME client (see docs/production-deployment.md).
ssl_certificate /etc/letsencrypt/live/librehub.example/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/librehub.example/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:LIBREHUB_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 9.9.9.9 valid=300s;
resolver_timeout 5s;
