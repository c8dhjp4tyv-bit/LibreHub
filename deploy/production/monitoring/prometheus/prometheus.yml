# Scrapes the LibreHub operator listener (never the public proxy). The API binds LIBREHUB_METRICS_BIND,
# a private address reached from this container through the host gateway (librehub-host).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: librehub-production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: librehub-api
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['librehub-host:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
